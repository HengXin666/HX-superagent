ff" stroke="#94a3b8" stroke-width="1.5"/><path d="M1283 178 a10 10 0 0 1 10 -10 h100 a10 10 0 0 1 10 10 v20 h-120 z" fill="#e2e8f0"/><text x="1343.0" y="188" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Replies</text><text x="1295" y="217" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Outbox</text><line x1="875" y1="185" x2="889" y2="185" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/><line x1="1007" y1="185" x2="1021" y2="185" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/><line x1="1139" y1="185" x2="1153" y2="185" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/><line x1="1271" y1="185" x2="1285" y2="185" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/><text x="50" y="346" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">· 5 个节点 + 下挂文字，不显示预设的层次</text><text x="50" y="367" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">· 编辑定位只到“块 / 字段 / 行”的文字面包屑</text><text x="50" y="388" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">· 不能缩放、平移</text><text x="755" y="346" font-size="12.5" font-weight="600" fill="#166534" text-anchor="start">＋ 预设链逐层画出，颜色与设置里的芯片一致</text><text x="755" y="367" font-size="12.5" font-weight="600" fill="#166534" text-anchor="start">＋ 点哪一层就跳到那一层的编辑处</text><text x="755" y="388" font-size="12.5" font-weight="600" fill="#166534" text-anchor="start">＋ 显示实际生效的底座：链上最后一个带底座的预设</text><text x="755" y="409" font-size="12.5" font-weight="600" fill="#166534" text-anchor="start">＋ 预设链有问题时标“预设底座未生效”，不误报</text><text x="755" y="430" font-size="12.5" font-weight="600" fill="#64748b" text-anchor="start">… 缩放、平移，及与提示词组装视图联动：计划中</text><text x="50" y="429" font-size="14" font-weight="700" fill="#334155" text-anchor="start">② 预设模型</text><rect x="50" y="443" width="200" height="52" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="60" y="464" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">底座预设</text><text x="60" y="484" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">单选，只能选 DSH 注册表里的</text><rect x="262" y="443" width="200" height="52" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="272" y="464" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">能力包</text><text x="272" y="484" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">可多选，管工具和指令</text><rect x="474" y="443" width="200" height="52" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="484" y="464" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">提示词预设</text><text x="484" y="484" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">可多选，管提示词各段</text><text x="50" y="517" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">· 三套概念，分散在 预设 / Eval / Execution / 提示词 四个地方</text><text x="50" y="538" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">· 自定义预设无法指定底座，用户感觉“只能选它给的”</text><text x="755" y="471" font-size="14" font-weight="700" fill="#334155" text-anchor="start">② 预设模型</text><rect x="755" y="485" width="635" height="96" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/><text x="767" y="507" font-size="13" font-weight="700" fill="#166534" text-anchor="start">每个角色一条有序预设链（主会话、Executor 各一条）</text><rect x="767" y="521" width="150" height="24" rx="12" fill="#e5f0fa" stroke="#478cd1" stroke-width="1"/><text x="779" y="537" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">预设 A</text><line x1="917" y1="533" x2="937" y2="533" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/><rect x="939" y="521" width="150" height="24" rx="12" fill="#faf0e5" stroke="#d18c47" stroke-width="1"/><text x="951" y="537" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">预设 B  · 带底座</text><line x1="1089" y1="533" x2="1109" y2="533" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/><rect x="1111" y="521" width="150" height="24" rx="12" fill="#e5fae5" stroke="#47d147" stroke-width="1"/><text x="1123" y="537" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">预设 C</text><text x="767" y="569" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">自定义预设可带 base：链上最后一个带底座的生效；角色跑不了的底座直接拒绝</text><text x="755" y="601" font-size="12.5" font-weight="600" fill="#166534" text-anchor="start">＋ 预设库新增“新建预设”按钮，芯片和列表上标出底座</text><text x="755" y="622" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">· 底座仍只认 DSH 注册表（插件不能凭空造 DSH 底座）</text><text x="50" y="579" font-size="14" font-weight="700" fill="#334155" text-anchor="start">③ 监控台</text><rect x="50" y="593" width="635" height="120" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="62" y="623" font-size="12" font-weight="600" fill="#475569" text-anchor="start">主会话</text><rect x="140" y="611" width="90" height="18" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/><text x="150" y="624" font-size="11" font-weight="400" fill="#475569" text-anchor="start">此刻状态</text><text x="62" y="653" font-size="12" font-weight="600" fill="#475569" text-anchor="start">槽位 1</text><rect x="140" y="641" width="90" height="18" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/><text x="150" y="654" font-size="11" font-weight="400" fill="#475569" text-anchor="start">此刻状态</text><text x="62" y="683" font-size="12" font-weight="600" fill="#475569" text-anchor="start">槽位 2</text><rect x="140" y="671" width="90" height="18" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/><text x="150" y="684" font-size="11" font-weight="400" fill="#475569" text-anchor="start">此刻状态</text><text x="280" y="653" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">泳道只显示“此刻”，没有时间轴</text><text x="50" y="733" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">· 有日志、调用链和一句话状态（verdictOf）</text><text x="50" y="754" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">· 当时运行的 lib/client.js 是旧构建，源码里的新功能没打进包</text><text x="755" y="663" font-size="14" font-weight="700" fill="#334155" text-anchor="start">③ 监控台</text><rect x="755" y="677" width="635" height="120" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/><text x="767" y="697" font-size="12" font-weight="700" fill="#166534" text-anchor="start">时间轴泳道  5 / 15 / 60 分钟</text><text x="767" y="724" font-size="12" font-weight="600" fill="#475569" text-anchor="start">主会话</text><line x1="855" y1="720" x2="1355" y2="720" stroke="#e2e8f0"/><text x="767" y="750" font-size="12" font-weight="600" fill="#475569" text-anchor="start">Ticket #41</text><line x1="855" y1="746" x2="1355" y2="746" stroke="#e2e8f0"/><text x="767" y="776" font-size="12" font-weight="600" fill="#475569" text-anchor="start">Ticket #42</text><line x1="855" y1="772" x2="1355" y2="772" stroke="#e2e8f0"/><rect x="875" y="711" width="120" height="18" rx="5" fill="#93c5fd" stroke="#93c5fd" stroke-width="1"/><rect x="935" y="737" width="220" height="18" rx="5" fill="#86efac" stroke="#86efac" stroke-width="1"/><rect x="1115" y="763" width="180" height="18" rx="5" fill="#fcd34d" stroke="#fcd34d" stroke-width="1"/><rect x="1185" y="737" width="70" height="18" rx="5" fill="#86efac" stroke="#86efac" stroke-width="1"/><line x1="1315" y1="705" x2="1315" y2="789" stroke="#ef4444" stroke-width="2"/><text x="1319" y="789" font-size="10" font-weight="600" fill="#ef4444" text-anchor="start">now</text><text x="755" y="817" font-size="12.5" font-weight="600" fill="#166534" text-anchor="start">＋ 每个 Ticket 一条道，进行中的段发光，点道打开调用链</text><text x="755" y="838" font-size="12.5" font-weight="600" fill="#166534" text-anchor="start">＋ 晚于 now 的事件夹到 now；只有 ticketId 对得上的道才标“已追踪”</text><text x="755" y="859" font-size="12.5" font-weight="600" fill="#64748b" text-anchor="start">… 后端带 id 的 Ticket 实时推送：计划外（按你的要求不开新战线）</text><rect x="755" y="894" width="635" height="96" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="767" y="916" font-size="13" font-weight="700" fill="#92400e" text-anchor="start">当前风险（2026-11-15 20:09 逐字节核对）</text><text x="767" y="938" font-size="12" font-weight="400" fill="#92400e" text-anchor="start">另一方的 token 重构后，client.css 里时间轴、底座未生效、预设层三组样式没了；</text><text x="767" y="958" font-size="12" font-weight="400" fill="#92400e" text-anchor="start">lib/client.js 里还在，所以现在重启能看到。用当前源码重新 build 会让时间轴变成 0 高。</text><text x="767" y="978" font-size="12" font-weight="700" fill="#92400e" text-anchor="start">计划第 1 步：按 token 形式补回这三组样式。</text><rect x="50" y="894" width="635" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="62" y="916" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">测试基线</text><text x="62" y="938" font-size="12" font-weight="400" fill="#475569" text-anchor="start">1302 过 / 10 败（10 个为本机环境类和 dt-stack-* 原有失败）</text><text x="62" y="958" font-size="12" font-weight="400" fill="#166534" text-anchor="start">v11 后：1313 过 / 10 败，tsc 通过；新增 built-panel 运行态测试</text><text x="62" y="978" font-size="12" font-weight="400" fill="#475569" text-anchor="start">未验证：真实 DSH 宿主与真实浏览器</text></svg>
